name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check the Gradle wrapper is the real one
        uses: gradle/actions/wrapper-validation@v4

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Looscid.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Looscid-debug-apk
          path: Looscid.apk

      - name: Make a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="whats-new/${GITHUB_REF_NAME}.txt"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" Looscid.apk --title "Looscid $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" Looscid.apk --title "Looscid $GITHUB_REF_NAME" --notes "Looscid $GITHUB_REF_NAME"
          fi
